<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>伟东 OPC 登录</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5f7; color: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .panel { width: min(360px, calc(100vw - 48px)); padding: 32px; border: 1px solid #dedfe3; border-radius: 8px; background: #fff; box-shadow: 0 16px 48px rgba(0, 0, 0, .12); }
    h1 { margin: 0 0 8px; font-size: 23px; } p { margin: 0 0 24px; color: #666; font-size: 14px; }
    label { display: grid; gap: 7px; margin: 14px 0; font-size: 13px; } input { box-sizing: border-box; width: 100%; height: 40px; padding: 0 11px; border: 1px solid #c8cad0; border-radius: 5px; font: inherit; }
    button { width: 100%; height: 42px; margin-top: 12px; border: 0; border-radius: 5px; background: #17181a; color: #fff; cursor: pointer; font: 600 14px inherit; } button:disabled { opacity: .6; cursor: wait; }
    #notice { min-height: 20px; margin: 12px 0 0; color: #b42318; }
  </style>
</head>
<body>
  <main class="panel"><h1>伟东 OPC</h1><p>登录后将打开属于当前商户的独立工作台。</p><form id="login"><label>账号<input id="username" autocomplete="username" required autofocus></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">登录</button><p id="notice"></p></form></main>
  <script>
    const form = document.getElementById('login'); const notice = document.getElementById('notice'); const submit = document.getElementById('submit');
    notice.textContent = new URLSearchParams(location.search).get('message') || '';
    form.addEventListener('submit', async (event) => { event.preventDefault(); notice.textContent = ''; submit.disabled = true; try { await window.dshDesktopAuth.signIn({ username: document.getElementById('username').value, password: document.getElementById('password').value }); } catch { notice.textContent = '登录失败，请检查账号、密码和网络后重试。'; } finally { submit.disabled = false; } });
  </script>
</body>
</html>
